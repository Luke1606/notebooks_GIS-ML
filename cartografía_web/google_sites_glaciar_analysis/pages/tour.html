<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Expedición Glaciar Global | Proyecto Final</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #00d4ff; --dark: #0a192f; --glass: rgba(255, 255, 255, 0.9); }
        body { margin: 0; display: flex; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark); overflow: hidden; height: 100vh; }
        
        #tour-panel {
            width: 350px; height: 100vh; overflow-y: auto;
            background: white; z-index: 1000; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #map { flex-grow: 1; height: 100vh; filter: contrast(1.1) brightness(0.9); }

        .info-header { padding: 20px; background: var(--dark); color: white; border-bottom: 4px solid var(--accent); }
        .info-header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
        .info-header p { font-size: 11px; opacity: 0.8; margin: 5px 0 0; }

        .tour-step {
            padding: 15px; border-bottom: 1px solid #eee; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column;
        }
        .tour-step:hover { background: #f0faff; border-left: 6px solid var(--accent); }
        .tour-step img { 
            width: 100%; height: 140px; object-fit: cover; 
            border-radius: 6px; margin-top: 10px; background: #333;
        }
        .tour-step h3 { margin: 0; font-size: 15px; color: var(--dark); }
        .tour-step p { font-size: 12px; color: #555; margin: 5px 0; line-height: 1.4; }

        .custom-popup .leaflet-popup-content-wrapper {
            background: var(--dark); color: #fff; border-radius: 8px; padding: 0; overflow: hidden;
        }
        .popup-img { width: 100%; height: 120px; object-fit: cover; display: block; }
        .popup-text { padding: 12px; }
        .dest-title { color: var(--accent); font-weight: bold; font-size: 14px; display: block; }
        .google-link { 
            display: inline-block; margin-top: 8px; color: #00d4ff; 
            text-decoration: none; font-size: 11px; font-weight: bold; 
        }
        .google-link:hover { text-decoration: underline; }

        .legend {
            padding: 10px; background: white; line-height: 18px; color: #333;
            border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); font-size: 11px;
        }
        .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="tour-panel">
        <div class="info-header">
            <h1>Expedición Glaciar</h1>
            <p><b>Explorador:</b> Luis Alberto Hernández Roselló</p>
            <p>Haz clic en un destino para analizar su estado.</p>
        </div>
        <div id="steps-container"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([20.0, 0.0], 2);

        var voyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

        var glaciers = [
            { 
                name: "Glaciar Perito Moreno", 
                coords: [-50.48, -73.05], 
                desc: "Argentina. Uno de los pocos glaciares que se mantiene estable, famoso por sus rupturas.",
                url: "https://fotografias.lasexta.com/clipping/cmsimages02/2019/03/05/417B5470-7EA5-4440-B015-1A0E8C30F6B9/97.jpg?crop=960,540,x0,y89&width=1600&height=900&optimize=high&format=webply"
            },
            { 
                name: "Glaciar Vatnajökull", 
                coords: [64.42, -16.78], 
                desc: "Islandia. El glaciar más grande de Europa por volumen, cubriendo varios volcanes activos.",
                url: "https://content-viajes.nationalgeographic.com.es/medio/2024/06/17/vatnajokull_1d39be99_1761292583_240617092913_1280x854.jpg"
            },
            { 
                name: "Glaciar Jakobshavn", 
                coords: [69.16, -49.83], 
                desc: "Groenlandia. El glaciar que más rápido fluye en el mundo y gran emisor de icebergs.",
                url: "https://www.fundacionaquae.org/wp-content/uploads/2019/04/glaciar-Jakobshavn-1024x512.jpg"
            },
            { 
                name: "Glaciar Lambert", 
                coords: [-71.0, 67.0], 
                desc: "Antártida. El glaciar más grande y largo del mundo, una autopista de hielo gigante.",
                url: "https://plus.unsplash.com/premium_photo-1661952970410-031f35202db6?q=80&w=1031&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            },
            { 
                name: "Glaciar Khumbu", 
                coords: [27.93, 86.82], 
                desc: "Nepal. Ubicado en el Everest, es el glaciar más alto del mundo.",
                url: "https://media.gettyimages.com/id/607958444/photo/trekkers-on-the-way-to-everest-base-camp.jpg?s=612x612&w=0&k=20&c=TrRWgxTshHcUZPos2teJ1d4bG-C30w9KxcNshSPvNQY="
            },
            { 
                name: "Glaciar Aletsch", 
                coords: [46.44, 8.04], 
                desc: "Suiza. El glaciar más grande de los Alpes, declarado Patrimonio de la Humanidad.",
                url: "https://img3.oastatic.com/img2/36921424/834x417r/variant.jpg"
            }
        ];

        var markerLayer = L.layerGroup().addTo(map);
        var container = document.getElementById('steps-container');

        glaciers.forEach((g, index) => {
            // Marker
            var m = L.circleMarker(g.coords, {
                radius: 10,
                fillColor: "#00d4ff",
                color: "#fff",
                weight: 2,
                fillOpacity: 1
            });

            // Generar link de búsqueda de Google
            var googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(g.name)}`;

            var popupContent = `
                <div class="custom-popup">
                    <img class="popup-img" src="${g.url}">
                    <div class="popup-text">
                        <span class="dest-title">${g.name}</span>
                        <p style="margin:5px 0; font-size:11px; color:#ccc;">${g.desc}</p>
                        <a href="${googleSearchUrl}" target="_blank" class="google-link">Ver más en Google...</a>
                    </div>
                </div>`;

            m.bindPopup(popupContent, { maxWidth: 220, padding: [0,0] });
            markerLayer.addLayer(m);

            // Panel Lateral
            var step = document.createElement('div');
            step.className = 'tour-step';
            step.innerHTML = `
                <h3>${index + 1}. ${g.name}</h3>
                <p>${g.desc}</p>
                <img loading="lazy" src="${g.url}" alt="${g.name}">
            `;
            
            step.onclick = function() {
                map.flyTo(g.coords, 12, { duration: 2.5 });
                setTimeout(() => { m.openPopup(); }, 2600);
            };
            
            container.appendChild(step);
        });

        // Línea de ruta
        var polyLayer = L.polyline(glaciers.map(g => g.coords), {
            color: '#00d4ff',
            weight: 2,
            dashArray: '5, 10',
            opacity: 0.6
        }).addTo(map);

        L.control.layers(
            { "Mapa Claro": voyager, "Vista Satélite": satellite }, 
            { "Glaciares": markerLayer, "Conexión": polyLayer },
            { collapsed: true, position: 'topright' }
        ).addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function() {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>Referencia</b><br>' +
                            '<i style="background: #00d4ff"></i> Glaciar<br>' +
                            '<i style="border: 1px dashed #00d4ff; background: transparent"></i> Ruta';
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
